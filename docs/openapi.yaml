openapi: 3.1.0
info:
  title: Idol Fan Site API
  version: 0.1.0
  description: |
    アイドルファンサイト REST API 仕様。Next.js 16 Route Handlers で実装。

    ## 認証方式 (2種類、多くのエンドポイントで両対応)
    - **Cookie セッション** (`sessionCookie`): Web ブラウザ向け。Auth.js v5
      (Credentials Provider) でログインすると発行される。
    - **Bearer トークン** (`bearerAuth`): モバイル / ネイティブアプリ (Unity 等) 向け。
      `POST /api/v1/auth/token` に email + password を送信して取得し、
      `Authorization: Bearer <accessToken>` ヘッダを付けて呼び出す。
      期限切れ時は `POST /api/v1/auth/token/refresh` で再発行する。
      (SSE/`EventSource` エンドポイントのみカスタムヘッダを送れないため、
      `?access_token=<accessToken>` クエリでも指定可)

    `security` に `bearerAuth` と `sessionCookie` の両方が列挙されているエンドポイントは、
    どちらの認証方式でも同じ URL・同じレスポンスで利用できる
    (Web とモバイルアプリで同一の API を共有する設計)。
    `Admin` タグのエンドポイントは管理画面専用のため `sessionCookie` のみ対応。

servers:
  - url: https://example.com
    description: 本番
  - url: http://localhost:3000
    description: ローカル開発

tags:
  - name: Auth
  - name: Subscriptions
  - name: Contents
  - name: Videos
  - name: Live
  - name: Products
  - name: Cart
  - name: Orders
  - name: Tickets
  - name: Me
  - name: Admin
  - name: Game
  - name: Call
  - name: API v1 (Mobile/Unity)

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-next-auth.session-token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        モバイル / ネイティブ (Unity 等) 向け API アクセストークン。
        `POST /api/v1/auth/token` で発行し、`Authorization: Bearer <accessToken>` で送る。

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }

    Plan:
      type: string
      enum: [FREE, STANDARD, PREMIUM]

    AccessLevel:
      type: string
      enum: [PUBLIC, MEMBERS, PREMIUM]

    Content:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        type: { type: string, enum: [BLOG, GALLERY] }
        accessLevel: { $ref: '#/components/schemas/AccessLevel' }
        coverImageUrl: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        basePrice: { type: integer }
        effectivePrice: { type: integer }
        isMembersOnly: { type: boolean }
        isPremiumExclusive: { type: boolean }
        thumbnailUrl: { type: string, nullable: true }
        inStock: { type: boolean }

    CartItem:
      type: object
      properties:
        id: { type: string }
        variantId: { type: string }
        productId: { type: string }
        productSlug: { type: string }
        productName: { type: string }
        variantName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: integer }
        subtotal: { type: integer }
        thumbnailUrl: { type: string, nullable: true }
        inStock: { type: boolean }
        available: { type: integer }
        blocked:
          oneOf:
            - { type: boolean, enum: [false] }
            - type: object
              properties:
                reason: { type: string }

    Cart:
      type: object
      properties:
        cartId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal: { type: integer }
        taxAmount: { type: integer }
        shippingFee: { type: integer }
        totalAmount: { type: integer }

    ShippingAddress:
      type: object
      required: [name, phone, postalCode, prefecture, addressLine1]
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        postalCode: { type: string, pattern: '^\d{3}-?\d{4}$' }
        prefecture: { type: string }
        addressLine1: { type: string, maxLength: 200 }
        addressLine2: { type: string, maxLength: 200 }

paths:
  # ─── Auth ─────────────────────────────────────────────────────────
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: 新規会員登録
      description: |
        アカウントを作成し、6桁の認証コードをメールで送信する。
        作成直後は `emailVerified` が未設定のため、`/api/auth/verify-email` でコードを
        入力して認証を完了するまでログインできない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  email,
                  password,
                  displayName,
                  fullName,
                  phone,
                  birthDate,
                  postalCode,
                  prefecture,
                  addressLine1,
                ]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                displayName: { type: string, maxLength: 50 }
                fullName: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 20 }
                birthDate: { type: string, format: date }
                postalCode: { type: string, pattern: '^\d{3}-?\d{4}$' }
                prefecture: { type: string }
                addressLine1: { type: string, maxLength: 200 }
                addressLine2: { type: string, maxLength: 200 }
                marketingOptIn: { type: boolean }
      responses:
        '200':
          description: 登録成功 (認証コードを送信)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  userId: { type: string }
                  email: { type: string, format: email }
                  emailSent: { type: boolean }
        '422':
          description: バリデーションエラー
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { description: メールアドレス重複 }

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: メール認証コードの確認
      description: |
        新規登録時にメールで送られた6桁の認証コードを入力し、`emailVerified` を設定する。
        有効期限 (発行から15分) 切れ、または5回連続で誤ったコードを入力した場合は
        `/api/auth/resend-verification-code` で再送が必要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$', description: 6桁の数字コード }
      responses:
        '200':
          description: 認証成功 (または既に認証済み)
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '400':
          description: コードが不正・期限切れ・入力回数超過
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: バリデーションエラー
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/auth/resend-verification-code:
    post:
      tags: [Auth]
      summary: 認証コードの再送
      description: |
        認証コードを再発行してメールで再送する (有効期限15分)。
        60秒以内の連続リクエストはクールダウンにより 429 を返す。
        メールアドレスの存在有無を漏らさないよう、未登録アドレスの場合も 200 を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 再送成功 (または対象ユーザーが存在しない/既に認証済み)
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '429': { description: クールダウン中 (再送しすぎ) }
        '422':
          description: バリデーションエラー
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/auth/[...nextauth]:
    post:
      tags: [Auth]
      summary: ログイン (Auth.js Credentials)
      description: |
        実体は `/api/auth/callback/credentials` 等。
        通常は `next-auth/react` の `signIn('credentials', ...)` を使用。
        メール未認証 (`emailVerified` が null) のユーザーはログインできず、
        `code=EMAIL_NOT_VERIFIED` のエラーが返る。

  # ─── Subscriptions ────────────────────────────────────────────────
  /api/subscriptions/checkout:
    post:
      tags: [Subscriptions]
      summary: Stripe Checkout (mode=subscription) URL を発行
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planType, billingInterval]
              properties:
                planType: { type: string, enum: [STANDARD, PREMIUM] }
                billingInterval: { type: string, enum: [MONTH, YEAR] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties: { url: { type: string } }

  /api/subscriptions/portal:
    post:
      tags: [Subscriptions]
      summary: Stripe Billing Portal URL を発行
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }

  /api/subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: 現在のサブスクリプション情報
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }

  /api/subscriptions/cancel:
    post:
      tags: [Subscriptions]
      summary: 解約予約 (cancel_at_period_end=true)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  /api/subscriptions/change-plan:
    post:
      tags: [Subscriptions]
      summary: プラン変更 (即時 proration)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  /api/subscriptions/monthly-bonus:
    get:
      tags: [Subscriptions]
      summary: 今月の月次ボーナス受給状況
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Subscriptions]
      summary: 月次ボーナスギフトを全アクティブ会員に付与 (Cron 用)
      description: |
        `x-cron-secret` ヘッダで CRON_SECRET と一致する場合、または
        ログイン中の管理者からのみ実行可能。
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }
        '401': { description: 未認証/CRON_SECRET不一致 }

  # ─── Contents ─────────────────────────────────────────────────────
  /api/contents:
    get:
      tags: [Contents]
      summary: 公開コンテンツ一覧 (プラン別表示制御)
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [BLOG, GALLERY] } }
        - { in: query, name: tag, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 12 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Content' }

  /api/contents/{slug}:
    get:
      tags: [Contents]
      summary: コンテンツ詳細
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200': { description: 成功 }
        '403': { description: プラン要件未達 }
        '404': { description: 見つからない }

  /api/contents/comments:
    get:
      tags: [Contents]
      summary: コメント一覧 (記事に紐づく)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: contentId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功 }
        '404': { description: 記事が見つからない }
    post:
      tags: [Contents]
      summary: コメント投稿 (スタンダード以上限定)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentId, body]
              properties:
                contentId: { type: string }
                body: { type: string }
      responses:
        '201': { description: 投稿成功 }
        '402': { description: プラン要件未達 }
        '404': { description: 記事が見つからない }

  /api/contents/comments/{id}:
    delete:
      tags: [Contents]
      summary: コメント削除 (本人 or 管理者のみ)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: 削除成功 }
        '403': { description: 権限なし }
        '404': { description: 見つからない }

  # ─── Videos ───────────────────────────────────────────────────────
  /api/videos:
    get:
      tags: [Videos]
      summary: 動画一覧 (プラン別表示制御)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }

  /api/videos/{id}:
    get:
      tags: [Videos]
      summary: 動画詳細
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: 成功 }
        '401': { description: 未認証 }
        '403': { description: プラン要件未達 }
        '404': { description: 見つからない }

  /api/videos/{id}/playback:
    get:
      tags: [Videos]
      summary: 動画 HLS の CloudFront 署名URL を発行
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }

  # ─── Live ─────────────────────────────────────────────────────────
  /api/live:
    get:
      tags: [Live]
      summary: 配信予定/配信中一覧

  /api/live/{id}/playback:
    get:
      tags: [Live]
      summary: IVS 署名 playback URL を発行
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }

  # ─── Products ─────────────────────────────────────────────────────
  /api/products:
    get:
      tags: [Products]
      summary: 商品一覧 (プラン別単価)
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }

  /api/products/{slug}:
    get:
      tags: [Products]
      summary: 商品詳細
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }

  /api/products/categories:
    get:
      tags: [Products]
      summary: カテゴリ一覧

  # ─── Cart ─────────────────────────────────────────────────────────
  /api/cart:
    get:
      tags: [Cart]
      summary: 自分のカート
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /api/cart/items:
    post:
      tags: [Cart]
      summary: カートに追加
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              properties:
                variantId: { type: string }
                quantity: { type: integer, minimum: 1 }

  /api/cart/items/{id}:
    patch:
      tags: [Cart]
      summary: 数量変更
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [Cart]
      summary: 削除
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }

  # ─── Orders ───────────────────────────────────────────────────────
  /api/orders/checkout:
    post:
      tags: [Orders]
      summary: カートから注文確定 + Stripe Checkout URL
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipping, successUrl, cancelUrl]
              properties:
                shipping: { $ref: '#/components/schemas/ShippingAddress' }
                notes: { type: string, maxLength: 500 }
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string }
                  orderNumber: { type: string }
                  checkoutUrl: { type: string }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: 注文詳細
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }

  # ─── Tickets ──────────────────────────────────────────────────────
  /api/tickets/events:
    get:
      tags: [Tickets]
      summary: チケットイベント一覧
      parameters:
        - { in: query, name: upcoming, schema: { type: boolean } }

  /api/tickets/events/{id}:
    get:
      tags: [Tickets]
      summary: イベント詳細
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }

  /api/tickets/link:
    get:
      tags: [Tickets]
      summary: ローソンチケット連携状態
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
    delete:
      tags: [Tickets]
      summary: 連携解除
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  /api/tickets/link/start:
    post:
      tags: [Tickets]
      summary: 連携開始 (verifyToken 発行)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  /api/tickets/link/confirm:
    post:
      tags: [Tickets]
      summary: 連携確定 (token + Lawson API 検証)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, lawsonUserId]
              properties:
                token: { type: string }
                lawsonUserId: { type: string }

  /api/tickets/presale/request:
    post:
      tags: [Tickets]
      summary: 先行受付申請 (LINKED + プラン + 期間チェック)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  /api/tickets/presale/grants:
    get:
      tags: [Tickets]
      summary: 自分の先行受付状況
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  # ─── Me ───────────────────────────────────────────────────────────
  /api/me:
    get:
      tags: [Me]
      summary: 自分のプロフィール
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
    patch:
      tags: [Me]
      summary: 表示名・住所などの更新
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  /api/me/orders:
    get:
      tags: [Me]
      summary: 注文履歴
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  /api/me/payments:
    get:
      tags: [Me]
      summary: 支払い履歴
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]

  /api/me/card:
    get:
      tags: [Me]
      summary: 会員カード情報 (会員番号を未付与なら採番)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }

  /api/me/points:
    get:
      tags: [Me]
      summary: ポイント残高 & 取引履歴 (直近50件)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }

  /api/me/login-bonus:
    get:
      tags: [Me]
      summary: 今日のログインボーナス受給状況
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Me]
      summary: 毎日のログインボーナスを受け取る
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }
        '409': { description: 本日は受給済み }

  /api/me/social-share:
    get:
      tags: [Me]
      summary: 今日の SNS シェア報酬受給状況 (プラットフォーム別)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Me]
      summary: SNS シェアを報告してポイント付与 (X / Instagram, 1日1回まで)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
