      summary: 待機キューの状態を Push する SSE エンドポイント
      description: |
        2秒間隔のポーリングベース SSE。`EventSource` は Authorization ヘッダを
        送れないため、Bearer トークンは `?access_token=<token>` クエリでも渡せる。
        未ログインでもイベント概要は取得できる。
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: access_token, schema: { type: string }, description: 'Bearerトークン (EventSource用)' }
      responses:
        '200': { description: 'text/event-stream' }

  /api/call/{roomId}/signal:
    post:
      tags: [Call]
      summary: offer/answer/ICE candidate を送信し同室の別ピアへ配信
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
      responses:
        '200': { description: 成功 }

  /api/call/{roomId}/events:
    get:
      tags: [Call]
      summary: シグナリングメッセージを受信する SSE エンドポイント
      description: |
        `EventSource` は Authorization ヘッダを送れないため、Bearer トークンは
        `?access_token=<token>` クエリでも渡せる。
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
        - { in: query, name: role, schema: { type: string, enum: [performer, fan] } }
        - { in: query, name: access_token, schema: { type: string }, description: 'Bearerトークン (EventSource用)' }
      responses:
        '200': { description: 'text/event-stream' }

